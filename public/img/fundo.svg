<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo da GesToque: formas suaves verde-azuladas e uma grade de pontos discreta. -->
  <defs>
    <pattern id="p" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0f766e" opacity="0.12"/>
    </pattern>
    <filter id="d" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f5faf9"/>
  <g filter="url(#d)">
    <circle cx="180" cy="160" r="260" fill="#7fd6c6" opacity="0.55"/>
    <circle cx="1420" cy="220" r="220" fill="#a8e6db" opacity="0.6"/>
    <circle cx="1280" cy="880" r="300" fill="#7fd6c6" opacity="0.45"/>
    <circle cx="420" cy="900" r="200" fill="#e2ab6c" opacity="0.28"/>
    <circle cx="860" cy="480" r="160" fill="#a8e6db" opacity="0.35"/>
  </g>
  <rect width="1600" height="1000" fill="url(#p)"/>
</svg>
